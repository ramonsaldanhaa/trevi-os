<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trevi — Entrar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 400px; }
    .login-logo {
      font-family: 'Cormorant', serif;
      font-style: normal;
      font-size: 32px;
      color: var(--verde);
      margin-bottom: 8px;
    }
    .login-logo span { font-weight: 600; }
    .login-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>

  <div class="login-box">
    <div class="login-logo"><span>tre</span>vi</div>
    <div class="login-sub">Portal de Recrutamento</div>

    <div id="alert" class="alert alert-erro" style="display:none"></div>

    <form id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="btn-entrar">
        Entrar
      </button>
    </form>
  </div>

  <script>
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-entrar');
      const alertEl = document.getElementById('alert');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      alertEl.style.display = 'none';

      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('senha').value,
      });

      if (error) {
        alertEl.textContent = 'Email ou senha incorretos.';
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
