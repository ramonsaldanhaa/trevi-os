<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trevi — Entrar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 400px; }
    .login-logo {
      font-family: 'Cormorant', serif;
      font-style: normal;
      font-size: 32px;
      color: var(--verde);
      margin-bottom: 8px;
    }
    .login-logo span { font-weight: 600; }
    .login-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>

  <div class="login-box">
    <div class="login-logo"><span>tre</span>vi</div>
    <div class="login-sub">Portal de Recrutamento</div>

    <div id="alert" class="alert alert-erro" style="display:none"></div>
    <div id="alert-ok" class="alert alert-ok" style="display:none"></div>

    <div id="step-email">
      <form id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="btn-entrar">
          Continuar
        </button>
      </form>
    </div>

    <div id="step-confirmacao" style="display:none">
      <p style="font-family:'Josefin Sans',sans-serif;font-style:normal;font-size:13px;letter-spacing:0.06em;color:#555;line-height:1.7;margin-bottom:24px">
        Enviamos um link de acesso para <strong id="email-enviado"></strong>.<br>
        Clique no link do email para entrar — sem senha necessária.
      </p>
      <button class="btn btn-secondary" style="width:100%" onclick="voltarEmail()">
        Usar outro email
      </button>
    </div>
  </div>

  <script>
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';

      const params = new URLSearchParams(window.location.hash.replace('#', '?'));
      const accessToken = params.get('access_token');
      if (accessToken) window.location.href = 'dashboard.html';
    })();

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-entrar');
      const alertErr = document.getElementById('alert');
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      alertErr.style.display = 'none';

      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
      });

      if (error) {
        alertErr.textContent = 'Não foi possível enviar o link. Verifique o email e tente novamente.';
        alertErr.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Continuar';
      } else {
        document.getElementById('email-enviado').textContent = email;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-confirmacao').style.display = 'block';
      }
    });

    function voltarEmail() {
      document.getElementById('step-email').style.display = 'block';
      document.getElementById('step-confirmacao').style.display = 'none';
      document.getElementById('email').value = '';
      document.getElementById('btn-entrar').disabled = false;
      document.getElementById('btn-entrar').textContent = 'Continuar';
    }
  </script>
</body>
</html>
